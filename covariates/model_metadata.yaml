# =============================================================================
# model_metadata.yaml
#
# Single source of truth for the published-score metadata shown in the Word
# report's Supplemental Table S2 ("Description of integer risk score models
# evaluated"). This file exists because S2 and Table 3b/3c previously drifted:
# S2 was a hardcoded data.frame() literal inside R/report_prognostic.R that
# described a DIFFERENT score (NSQIP-derived, amputation-cohort, 9-component,
# AUROC 0.73) than the one covariates.csv / Table 3b actually implements
# (VSGNE-derived, elective lower-extremity bypass cohort, C statistic 0.77).
# Table 3b was always correct because it is generated from covariates.csv;
# S2 was wrong because nothing forced it to agree.
#
# R/report_prognostic.R reads this file once (via yaml::read_yaml()) and
# builds Supplemental Table S2 from it, so a future correction to a score's
# derivation details only needs to happen here — never inside the report
# generator itself.
#
# Every field below is sourced directly from the published paper (see the
# `reference` field of each entry), NOT from AI training-data recall alone —
# per Rule 1, treat any value here you did not personally verify against the
# cited source as [pretraining] and re-check before publication.
# =============================================================================

iannuzzi:
  score_name: "Iannuzzi 2020 NHD integer risk score"
  reference: "Iannuzzi JC et al. J Vasc Surg 2020;71:889-95"
  derivation_registry: "Vascular Study Group of New England (VSGNE)"
  derivation_years: "2003-2017"
  derivation_procedure: "elective lower extremity bypass (LEB) for peripheral arterial disease"
  derivation_n: 10145
  derivation_nhd_rate: "26.4%"
  derivation_exclusions:
    - "urgent or emergent cases"
    - "not admitted from home"
    - "bedridden"
    - "died during index admission"
  outcome_definition: >
    Non-home discharge (NHD): discharge to rehabilitation facility or skilled
    nursing facility (SNF) ONLY. Does NOT include hospice or long-term acute
    care (LTAC) — narrower than this study's NHD outcome definition, which
    additionally counts hospice and LTAC as non-home (see Methods 1.2 and the
    Limitations discussion of this population/outcome mismatch).
  prediction_window: "Index hospitalisation"
  score_design: >
    Integer score (0-18 pts) from 9 pre-operative components: age 60-69 (+2),
    70-79 (+4), >=80 (+6) [reference: age <60, 0 pts]; sex/race interaction
    modelled as white female (+1), nonwhite male (+2), nonwhite female (+3)
    [reference: white male, 0 pts; implemented in this study as two additive
    binary components, female +1 and non-White +2, which reproduces the
    published point totals exactly because the interaction's integer weights
    are exactly additive]; ambulation deficit (+3); tissue loss (+3); anemia
    (+2); insulin-dependent diabetes (+2).
  score_range: "0-18"
  c_statistic_derivation: 0.77
  c_statistic_validation: 0.78

mfi5:
  score_name: "Subramaniam 2018 modified Frailty Index - 5-item (mFI-5)"
  reference: "Subramaniam S et al. J Am Coll Surg 2018;226:173-181.e8"
  derivation_registry: "ACS NSQIP"
  # [pretraining] NOT independently re-verified against the source paper this
  # round — the earlier hardcoded S2 block's "2012-2016" range was flagged by
  # peer review as likely wrong. Confirm against 10.1016/j.jamcollsurg.2017.11.005
  # before this is cited in a manuscript.
  derivation_years: "2012 (last NSQIP year all 11 mFI variables were captured, per source)"
  derivation_procedure: "general surgery procedures (not amputation- or PAD-specific)"
  derivation_n: null
  derivation_nhd_rate: null
  derivation_exclusions: []
  outcome_definition: >
    Derived and validated to predict MORTALITY, postoperative complications,
    and unplanned 30-day readmission — NOT non-home discharge. mFI-5 is a
    general frailty index, not an NHD-specific score; this study repurposes
    it to test whether frailty burden transports to NHD prediction in this
    cohort (see the transportability framing in Methods 1.3).
  prediction_window: null
  score_design: >
    Modified Frailty Index (5-item, range 0-5): 1 point each for diabetes
    mellitus (any type), COPD, congestive heart failure (30-day lookback per
    the original publication), hypertension (medication requirement not
    enforced in this implementation — a documented proxy limitation), and
    dependent functional status.
  score_range: "0-5"
  c_statistic_derivation: "Not reported for NHD (mFI-5 was not derived to predict NHD)"
  c_statistic_validation: null

vqifs:
  score_name: "Kraiss 2022 simple VQI Frailty Score (sVQI-FS)"
  reference: "Kraiss LW, Al-Dulaimi R, Allen CM, Mell MW, Arya S, Presson AP, Brooke BS. J Vasc Surg 2022;76:1325-34"
  derivation_registry: "Vascular Quality Initiative (VQI) — seven registries"
  derivation_years: "2010-2017"
  derivation_procedure: "non-emergent vascular surgery cases (not amputation- or PAD-specific)"
  derivation_n: 265632
  derivation_nhd_rate: null
  derivation_exclusions:
    - "emergent cases"
  outcome_definition: >
    Derived and validated to predict 9-MONTH MORTALITY (AUC 0.724) — NOT
    non-home discharge. Like the mFI-5, this study repurposes the sVQI-FS to
    test transportability to NHD prediction rather than treating it as an
    NHD score being externally validated on its own terms.
  prediction_window: null
  score_design: >
    The published instrument is a PROPORTION, not an integer count: sVQI-FS =
    (number of positive frailty items) / (number of items evaluated), over 11
    items, and is not computed at all when fewer than five domains have data.
    This study recasts it as an integer point sum (1 point per positive item)
    so it is directly comparable with the Iannuzzi and mFI-5 integer scores in
    this repo, and scores every patient rather than suppressing sparse records.
    Implemented here as 0-10; the published instrument's 11th item, non-home
    residence, is omitted — see covariates/covariates_vqifs.csv header.
    1 point each for hypertension, congestive heart failure,
    coronary artery disease, peripheral vascular disease, diabetes mellitus,
    COPD, renal impairment (creatinine >1.8 mg/dL or dialysis), anemia
    (sex-specific Hgb threshold), underweight (BMI <18.5), and non-ambulatory
    status. NOTE: this is the EQUALLY weighted form. The paper states "The term
    VQI-FS refers to the differentially weighted model. We do not recommend the
    use of the equally weighted sVQI-FS to estimate 9-month mortality." That
    differentially weighted 7-item VQI-FS (AUC 0.758) requires nomogram
    regression coefficients plus a procedure-specific risk term whose
    categories (CEA, CAS, EVAR, open AAA, PVI, SUPRA, INFRA) do not include
    major amputation, so it cannot be applied in this cohort. The disavowal is
    scoped to estimating 9-month mortality, which this study does not do — the
    raw score is locally recalibrated to NHD instead.
  score_range: >
    0-10 integer as implemented here; the original publication reports a 0-1
    proportion (positive items / items evaluated; cohort mean and median 0.3),
    NOT an integer count.
  c_statistic_derivation: "AUC 0.724 (9-month mortality, not NHD; equally weighted sVQI-FS. The authors' preferred differentially weighted VQI-FS with procedure-specific risk achieved AUC 0.758 and is not implemented here.)"
  c_statistic_validation: null
